<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaFacil - Login</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <header>
        <h1>AgendaFacil</h1>
        <p>Cadastre-se</p>
    </header>
    <main>
        <div class="container">
            <h2>Login</h2>
            <p class="subtitulo">Faça login para acessar a plataforma</p>

            <input type="email" name="email" id="email" placeholder="Email">
            <input type="password" name="senha" id="senha">

            <button type="submit" id="botEntrar">Entrar</button>
            
            <p>Ainda não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            <p >Esqueci meu email ou senha</p>
        </div>
    </main>
</body>
</html>
